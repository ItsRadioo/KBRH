<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBRH Resident Assignment Board</title><style>body{background:#142231;color:white;font-family:Arial,sans-serif;margin:0;padding:2vw}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #5e768a;padding-bottom:12px}h1{margin:0;font-size:clamp(24px,3vw,52px)}h2{background:#30485f;padding:14px;border-radius:9px;font-size:clamp(18px,2vw,30px)}main{display:grid;grid-template-columns:1fr 1fr;gap:2vw}.entry{background:#263b4d;border-radius:8px;margin:9px 0;padding:12px;font-size:clamp(16px,1.45vw,25px)}.today{outline:3px solid #e9c06d}.name{font-weight:700}small{color:#c4d4e0}#notice{padding:12px;color:#e9c06d}@media(max-width:800px){main{grid-template-columns:1fr}}@media print{body{background:white;color:black}.entry{background:white;border:1px solid black}}.board-controls{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.board-controls input,.board-controls button{font:inherit;padding:8px;border-radius:6px;border:1px solid #aabac8}.board-controls button{cursor:pointer;background:#30485f;color:white}.board-controls select{font:inherit;padding:8px;border-radius:6px;background:#30485f;color:#fff;border:1px solid #aabac8}
main{display:block}main section{display:none}main section.active{display:block}
.board-controls{margin-top:12px}.entry{box-sizing:border-box}
body.display-mode{padding:1.2vh 2vw;height:100vh;box-sizing:border-box;overflow:hidden}
body.display-mode header{padding-bottom:1vh}body.display-mode h1{font-size:clamp(22px,3.2vh,48px)}
body.display-mode .board-controls,body.display-mode #notice{display:none}
body.display-mode main{height:calc(100vh - 15vh);overflow:hidden}
body.display-mode section.active{height:100%;overflow:hidden}
body.display-mode h2{margin:1vh 0;padding:1vh 1vw;font-size:clamp(20px,3vh,36px)}
body.display-mode #meals,body.display-mode #chores{height:calc(100% - 7vh);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(42%,350px),1fr));grid-auto-rows:1fr;gap:1vh 1vw;overflow:hidden}
body.display-mode .entry{margin:0;padding:clamp(6px,1vh,16px);font-size:clamp(13px,2.1vh,29px);overflow:hidden}
body.display-mode .entry b{font-size:1.1em}
@media(max-width:800px){body.display-mode #meals,body.display-mode #chores{grid-template-columns:1fr 1fr}}

/* v5.6.29: printable-template inspired stacked schedules */
main section{width:100%}.schedule-table{width:100%;border-collapse:collapse;table-layout:fixed;background:#f9fbfd;color:#172535;font-size:clamp(13px,1.5vw,23px)}
.schedule-table th{background:#30485f;color:white;text-align:left;padding:10px 12px;border:1px solid #73879a}
.schedule-table td{padding:9px 12px;border:1px solid #8c9aa7;vertical-align:middle;overflow-wrap:anywhere}
.schedule-table tbody tr:nth-child(even){background:#e8eef3}
.schedule-table .today td{background:#fff0bc;color:#172535}
.schedule-table .assignment-name{font-weight:700}.schedule-table .duty-description{white-space:pre-line;font-size:.77em;line-height:1.22;color:#465565}
.schedule-table .day-cell{font-weight:700;width:18%}
body.display-mode main{height:calc(100vh - 14vh)}body.display-mode section.active{display:flex;flex-direction:column;min-height:0}
body.display-mode .schedule-table{flex:1;height:100%;font-size:clamp(12px,2.1vh,27px)}
body.display-mode .schedule-table td,body.display-mode .schedule-table th{padding:clamp(3px,.6vh,10px) clamp(6px,1vw,18px)}
body.display-mode #meals,body.display-mode #chores{display:block;height:auto;flex:1;min-height:0;overflow:hidden}
body.display-mode .schedule-table .duty-description{font-size:.7em;line-height:1.08}
@media(max-width:750px){.schedule-table{font-size:12px}.schedule-table td,.schedule-table th{padding:5px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js?v=5.6.25"></script><script src="data-store.js?v=5.6.20"></script><script>requireLogin();</script></head><body><header><div><small>KEN BROWN RECOVERY HOME</small><h1>Resident Assignment Board</h1><div id="week"></div><div class="board-controls"><label for="boardWeek">Display week</label> <input id="boardWeek" type="date"> <button id="boardCurrent" type="button">Current week</button><button id="boardMeals" type="button">Meal Chores</button><button id="boardChores" type="button">House Chores</button><label for="boardInterval">Rotate every</label><select id="boardInterval"><option value="15">15 seconds</option><option value="30" selected>30 seconds</option><option value="60">60 seconds</option></select><button id="boardDisplay" type="button">Start Display Mode</button></div></div><div id="clock"></div></header><main><section id="mealPanel" class="active"><h2>Meal Chores</h2><div id="meals"></div></section><section id="chorePanel"><h2>Weekly House Chores</h2><div id="chores"></div></section></main><div id="notice">Read-only display · Published schedules only</div><script src="assignment-board.js?v=5.6.29"></script></body></html>
