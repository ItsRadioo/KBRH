<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Chat | KBRH</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="kbrh-modern.css"><link rel="stylesheet" href="chat.css"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js?v=5.6.22"></script><script>requireLogin()</script><style>body:has(.chat-layout) header{display:none}body:has(.chat-layout) .chat-layout{height:100dvh;margin:0;padding:0;display:flex;flex-direction:column}body:has(.chat-layout) .chat-side{max-height:42%;overflow:auto}body:has(.chat-layout) .chat-main{min-height:0;flex:1}body:has(.chat-layout) .chat-messages{min-height:0;overflow:auto}body:has(.chat-layout) .chat-compose{flex-shrink:0}</style></head><body><header><div class="header-top"><div class="brand-and-title"><div class="brand-mark">KB</div><div class="page-heading"><span class="app-name">Ken Brown Recovery Home</span><h1>Staff Chat</h1></div></div><button class="logout-btn" onclick="logout()">Sign Out</button></div><nav class="app-nav"><a class="app-nav-link" href="dashboard.html">Dashboard</a><a class="app-nav-link" href="roster.html">Roster</a><a class="app-nav-link" href="waitlist.html">Waitlist</a><a class="app-nav-link active" href="chat.html">Staff Chat</a></nav></header><main class="chat-layout"><aside class="chat-side"><div class="chat-toolbar"><h2>Conversations</h2><button id="newChat" type="button">New</button></div><button id="staffWide" class="chat-wide" type="button">Staff-wide channel</button><div id="conversations" aria-label="Conversations"></div><p id="chatStatus" role="status"></p></aside><section class="chat-main"><h2 id="chatTitle">Choose a conversation</h2><div id="messages" class="chat-messages" aria-live="polite"></div><form id="messageForm" class="chat-compose"><label for="messageText" class="sr-only">Message</label><textarea id="messageText" rows="2" maxlength="4000" placeholder="Write a message…" required></textarea><button type="submit">Send</button></form></section></main><dialog id="newDialog"><form method="dialog"><h2>New conversation</h2><label>Conversation type <select id="chatType"><option value="direct">Direct message</option><option value="group">Group conversation</option></select></label><label id="groupNameWrap" hidden>Group name <input id="groupName" maxlength="80"></label><fieldset id="staffChoices"><legend>Choose staff</legend></fieldset><div class="dialog-actions"><button value="cancel">Cancel</button><button id="createChat" value="create">Create</button></div></form></dialog><script src="chat.js?v=2"></script><script src="chat-floating.js?v=4"></script></body></html>
