<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Temporary Password | KBRH</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="kbrh-modern.css"><link rel="stylesheet" href="kbrh-v5.css?v=5.6.1"><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="firebase-config.js"></script><script src="auth.js?v=5.6.1"></script><script>requireLogin();</script></head><body class="login-body"><main class="login-wrap"><section class="card login-card"><h1>Set Your Password</h1><p class="hint">Your account was created with a temporary password. Set a private password before continuing.</p><label>New Password</label><input id="newPassword" type="password" autocomplete="new-password"><label>Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password"><button id="changePassword" type="button">Set Password & Continue</button><p id="passwordStatus" class="error"></p></section></main><script>document.getElementById('changePassword').onclick=async()=>{const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value,s=document.getElementById('passwordStatus');if(p.length<10)return s.textContent='Use at least 10 characters.';if(p!==c)return s.textContent='Passwords do not match.';try{await auth.currentUser.updatePassword(p);const fn=firebase.app().functions('northamerica-northeast1').httpsCallable('completeFirstLoginPasswordChange');await fn({});kbrhStaffProfile=null;window.location.replace('index.html')}catch(e){console.error(e);s.textContent=e.message||'Password could not be changed.'}};</script></body></html>
