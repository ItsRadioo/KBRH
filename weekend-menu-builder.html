<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weekend Menu Builder</title>
<link href="style.css" rel="stylesheet"/><link href="kbrh-modern.css" rel="stylesheet"/><link href="kbrh-v5.css" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="auth.js"></script><script>requireLogin();</script>
<style>
.menu-builder{max-width:1200px;margin:0 auto}.menu-grid{display:grid;gap:14px}.menu-day{border:1px solid #d7dde5;border-radius:12px;padding:16px;background:#fff}.menu-day-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.menu-day h3{margin:0}.menu-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu-fields label{font-weight:700}.menu-fields textarea,.menu-fields input{width:100%;box-sizing:border-box;margin-top:5px}.menu-fields textarea{min-height:74px;resize:vertical}.menu-fields .full{grid-column:1/-1}.preview-wrap{margin-top:22px}.preview-table{width:100%;border-collapse:collapse;background:#fff}.preview-table th,.preview-table td{border:1px solid #222;padding:9px;vertical-align:top;text-align:left}.preview-table th{background:#f0f2f5}.empty-note{padding:18px;text-align:center;color:#667085}.danger-small{background:#fff;color:#9b1c1c;border:1px solid #d9a6a6;padding:7px 10px;border-radius:7px}.builder-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}@media(max-width:760px){.menu-fields{grid-template-columns:1fr}.menu-fields .full{grid-column:auto}}@media print{header,.builder-editor,.no-print{display:none!important}.menu-builder{max-width:none}.preview-wrap{margin:0}.preview-table{font-size:11pt}.preview-table th,.preview-table td{padding:6px}@page{size:letter landscape;margin:.4in}}
</style>
</head>
<body>
<header><div class="header-top"><div class="brand-and-title"><div class="page-heading"><span class="app-name">Ken Brown Recovery Home</span><h1>Weekend Menu Builder</h1><p>Build the meal and chore table, then print only the finished table.</p></div></div><button class="logout-btn" onclick="logout()" type="button">Sign Out</button></div></header>
<main class="menu-builder">
<section class="card wide builder-editor">
<h2>Menu Builder</h2>
<div class="builder-actions"><button id="addDayBtn" type="button">+ Add Day</button><button id="generateBtn" type="button">Generate Table</button><button class="secondary" id="clearBtn" type="button">Clear</button><a class="button-link secondary" href="meal-chores.html">Back to Meal Chores</a></div>
<div id="dayEditor" class="menu-grid"></div>
</section>
<section class="card wide preview-wrap">
<div class="no-print" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="margin-bottom:4px">Generated Table</h2><p class="hint" style="margin-top:0">Only this table is included when you print.</p></div><button id="printBtn" type="button">Print Table / Save PDF</button></div>
<div id="tableOutput" class="empty-note">Add your days and click Generate Table.</div>
</section>
</main>
<script src="weekend-menu-builder.js"></script><script src="kbrh-v5.js"></script>
</body></html>
