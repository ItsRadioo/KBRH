<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Weekend Menu Builder</title>
<link href="style.css" rel="stylesheet"/>
<link href="kbrh-modern.css" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>requireLogin();</script>
<link href="kbrh-v5.css" rel="stylesheet"/>
<script src="kbrh-nav.js"></script>
<style>
  .menu-builder-grid{display:grid;gap:16px;margin-top:16px}
  .menu-day-card{border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:16px;background:#fff}
  .menu-day-head{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
  .menu-day-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .menu-day-fields label{display:flex;flex-direction:column;gap:6px;font-weight:600}
  .menu-day-fields textarea,.menu-day-fields select{width:100%;box-sizing:border-box}
  .menu-day-fields textarea{min-height:78px;resize:vertical}
  .dessert-field[hidden]{display:none!important}

  .generated-menu{margin:28px auto 0;max-width:900px}
  .generated-menu-title{text-align:center;margin:0 0 16px;font-size:1.35rem}
  .document-menu{border:1.5px solid #222;background:#fff;color:#111;font-family:"Times New Roman",Times,serif}
  .document-day + .document-day{border-top:1.5px solid #222}
  .document-day-title{font-family:"Times New Roman",Times,serif;font-size:28px;font-weight:700;line-height:1.05;text-align:center;padding:4px 10px 5px;border-bottom:1px solid #555}
  .document-day-content{display:grid;grid-template-columns:1fr 1fr;min-height:190px}
  .document-day.meals-3 .document-day-content{min-height:300px}
  .document-meals,.document-chore{padding:10px 18px 14px;text-align:center;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
  .document-chore{border-left:1.5px solid #222}
  .document-section{margin:0 0 28px}
  .document-section:last-child{margin-bottom:0}
  .document-label{font-size:27px;font-weight:700;text-decoration:underline;text-underline-offset:3px;line-height:1.05;margin:0 0 7px}
  .document-value{font-size:21px;line-height:1.22;white-space:pre-line;overflow-wrap:anywhere}
  .document-chore .document-label{font-size:27px}
  .document-chore .document-value{margin-top:28px}
  .document-empty{opacity:.42;font-style:italic}

  @media(max-width:760px){
    .menu-day-fields{grid-template-columns:1fr}
    .generated-menu{overflow-x:auto}
    .document-menu{min-width:660px}
  }
  @media print{
    @page{size:letter portrait;margin:.55in}
    header,.builder-controls,.menu-builder-grid,.no-print,.generated-menu-title{display:none!important}
    html,body{background:#fff!important}
    body{margin:0!important}
    main{max-width:none!important;margin:0!important;padding:0!important}
    .card{box-shadow:none!important;border:0!important;padding:0!important;margin:0!important;background:#fff!important}
    .generated-menu{display:block!important;max-width:none!important;margin:0!important;overflow:visible!important}
    .document-menu{width:100%;border:1px solid #111}
    .document-day{break-inside:avoid;page-break-inside:avoid}
    .document-day + .document-day{border-top:1px solid #111}
    .document-day-title{font-size:20pt;padding:2px 8px 3px;border-bottom:1px solid #555}
    .document-day-content{min-height:135px}
    .document-day.meals-3 .document-day-content{min-height:220px}
    .document-meals,.document-chore{padding:6px 12px 9px}
    .document-chore{border-left:1px solid #111}
    .document-section{margin-bottom:18px}
    .document-label,.document-chore .document-label{font-size:19pt;margin-bottom:4px}
    .document-value{font-size:15.5pt;line-height:1.15}
    .document-chore .document-value{margin-top:20px}
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="brand-and-title"><div aria-hidden="true" class="brand-mark">KB</div><div class="page-heading"><span class="app-name">Ken Brown Recovery Home</span><h1>Weekend Menu Builder</h1><p>Create a clean meal and chore schedule one day at a time.</p></div></div>
    <button class="logout-btn" onclick="logout()" type="button">Sign Out</button>
  </div>
  <nav aria-label="Primary navigation" class="app-nav"></nav>
</header>
<main>
<section class="card wide">
  <div class="builder-controls">
    <h2>Build Schedule</h2>
    <p class="hint">Add each day, choose the weekday, then enter lunch, supper and chores. Sunday automatically includes dessert.</p>
    <div class="button-row">
      <button id="addDayBtn" type="button">+ Add Day</button>
      <button id="generateTableBtn" type="button">Generate Table</button>
      <button class="secondary" id="clearDaysBtn" type="button">Clear</button>
      <button class="secondary" id="printTableBtn" type="button">Print Table</button>
    </div>
  </div>
  <div id="dayCards" class="menu-builder-grid"></div>
  <div id="generatedMenu" class="generated-menu" hidden>
    <h2 class="generated-menu-title">Weekend Menu &amp; Chores</h2>
    <div id="generatedMenuBody" class="document-menu" aria-label="Generated weekend menu and chore schedule"></div>
  </div>
</section>
</main>
<script src="weekend-menu-builder.js"></script>
<script src="kbrh-v5.js"></script>
</body>
</html>
