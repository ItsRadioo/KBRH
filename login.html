<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Staff Login | Resident Chore Rotator</title>
<link href="style.css" rel="stylesheet"/><link href="kbrh-modern.css" rel="stylesheet"/>
<link href="kbrh-v5.css" rel="stylesheet"/>
</head>
<body class="login-body page-login">
<main class="login-wrap">
<section class="card login-card"><div class="login-brand"><div class="login-brand-mark">KB</div><div><strong>Ken Brown Recovery Home</strong><span>Staff Administration</span></div></div>
<h1>Staff Login</h1>
<p class="hint">Sign in with your staff account.</p>
<label for="email">Email</label>
<input autocomplete="username" id="email" placeholder="staff@example.com" type="email"/>
<label for="password">Password</label>
<input autocomplete="current-password" id="password" placeholder="Password" type="password"/>
<button id="loginBtn" type="button">Login</button>
<p class="error" id="errorMessage"></p>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
    const SESSION_KEY = "kbrh.activeStaffSession";

    async function handleLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const error = document.getElementById("errorMessage");
      error.textContent = "";

      if (!email || !password) {
        error.textContent = "Enter your email and password.";
        return;
      }

      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
        const credential = await auth.signInWithEmailAndPassword(email, password);
        sessionStorage.setItem(SESSION_KEY, credential.user.uid);
        // A valid Firebase Authentication login is enough to enter the system.
        // If a staff profile exists in kbrh/staffProfiles it will be used for
        // names/auditing. Missing profiles temporarily fall back to the user's
        // Firebase display name/email so existing accounts are never locked out.
        try {
          const profileDoc = await db.collection("kbrh").doc("staffProfiles").get();
          const profile = profileDoc.exists ? profileDoc.data()?.profiles?.[credential.user.uid] : null;
          if (profile && profile.active === false) {
            sessionStorage.removeItem(SESSION_KEY);
            await auth.signOut();
            error.textContent = "This staff account is inactive. Contact the administrator.";
            return;
          }
        } catch (profileError) {
          console.warn("Staff profile lookup failed; continuing with authenticated Firebase identity.", profileError);
        }
        window.location.replace("index.html");
      } catch (err) {
        console.error(err);
        error.textContent = "Login failed. Check the email and password.";
      }
    }

    if (new URLSearchParams(location.search).get("profile") === "inactive") {
      document.getElementById("errorMessage").textContent = "This staff account is inactive. Contact the administrator.";
    }
    document.getElementById("loginBtn").onclick = handleLogin;
    document.getElementById("password").addEventListener("keyup", event => {
      if (event.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
